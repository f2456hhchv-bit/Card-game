# Builds AFTERLIGHT and publishes it to GitHub Pages so it can be played from a
# plain web link (e.g. on a phone) — no install, no local files.
#
# Requires the repository to be public (free GitHub Pages) or a paid plan for
# private Pages. `configure-pages` with enablement:true turns Pages on
# automatically the first time this runs.
#
# Runs on demand (workflow_dispatch) and on every push to the default branch so
# the hosted game stays up to date.
name: Deploy AFTERLIGHT to GitHub Pages

# Auto-deploys on every push to the default branch (Pages is confirmed working),
# plus on-demand via the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: ["claude/afterlight-master-constitution-aelnnj"]

# Permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Now that the repo is public, the workflow token can create the Pages
      # site automatically (this failed earlier only because the repo was still
      # private at the time).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
