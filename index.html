<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AFTERLIGHT</title>
    <style>
      /* AF-008 master colour tokens (docs/COLOUR_SYSTEM.md §1) */
      :root {
        --space-black: #05060a;
        --space-blue: #101a38;
        --energy-white: #f4f7ff;
        --energy-violet: #9b5cff;
        --plasma-cyan: #3fd4f5;
        --neutral-grey: #8a93a6;
        --danger-red: #ff4054;
        --solar-gold: #ffc652;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: var(--space-black);
        color: var(--energy-white);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow-y: auto;
        overflow-x: hidden;
      }
      /* GP-003: Home Base's action list has grown past a single viewport —
         min-height (not height) lets #app grow taller than the screen and
         scroll rather than clipping buttons under the old overflow:hidden. */
      #app { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 1rem 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
