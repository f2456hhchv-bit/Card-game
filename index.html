<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- iOS home-screen app icon + fullscreen app-like launch. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFTERLIGHT" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:title" content="AFTERLIGHT" />
    <meta property="og:image" content="./icon-512.png" />
    <meta
      name="description"
      content="AFTERLIGHT — an offline bullet-heaven survival roguelite. Hold back the dark."
    />
    <title>AFTERLIGHT</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: optimizeSpeed;
      }
      /* Loading splash, removed once the game boots. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: radial-gradient(circle at 50% 40%, #0b1024 0%, #05060a 70%);
        color: #aeb9ff;
        z-index: 50;
        transition: opacity 0.4s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        letter-spacing: 0.35em;
        font-weight: 800;
        text-indent: 0.35em;
        background: linear-gradient(180deg, #ffffff, #7d8cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(125, 140, 255, 0.35);
      }
      #boot p {
        font-size: 0.9rem;
        letter-spacing: 0.2em;
        opacity: 0.6;
        text-transform: uppercase;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(125, 140, 255, 0.25);
        border-top-color: #7d8cff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="boot">
      <h1>AFTERLIGHT</h1>
      <div class="spinner"></div>
      <p>Hold back the dark</p>
    </div>
    <!--
      Classic (non-module) boot watchdog. Runs even if the main module fails to
      parse or is blocked, so the player never gets stuck on an infinite spinner
      without explanation. The main module hides #boot once it starts.
    -->
    <script>
      (function () {
        function fail(detail) {
          var boot = document.getElementById("boot");
          if (!boot || boot.classList.contains("hidden")) return;
          boot.innerHTML =
            '<h1 style="font-size:1.6rem;letter-spacing:0.15em">AFTERLIGHT</h1>' +
            '<p style="max-width:90vw;text-align:center;line-height:1.5;opacity:0.9">' +
            "Couldn't start the game in this browser.<br/>" +
            "Please try a recent <b>Chrome</b>, <b>Edge</b>, <b>Firefox</b> or <b>Safari</b>." +
            "</p>" +
            (detail
              ? '<p style="font-size:0.7rem;opacity:0.5;max-width:90vw;word-break:break-word">' +
                String(detail) +
                "</p>"
              : "");
        }
        window.addEventListener("error", function (e) {
          fail(e && e.message ? e.message : "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          fail(e && e.reason ? e.reason : "");
        });
        // Watchdog: if still on the splash after 7s, something went wrong.
        setTimeout(function () {
          fail("");
        }, 7000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
