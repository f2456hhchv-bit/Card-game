<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060a'/%3E%3Cpath d='M16 4 L19 13 L28 16 L19 19 L16 28 L13 19 L4 16 L13 13 Z' fill='%23aeb9ff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="AFTERLIGHT — an offline bullet-heaven survival roguelite. Hold back the dark."
    />
    <title>AFTERLIGHT</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: optimizeSpeed;
      }
      /* Loading splash, removed once the game boots. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: radial-gradient(circle at 50% 40%, #0b1024 0%, #05060a 70%);
        color: #aeb9ff;
        z-index: 50;
        transition: opacity 0.4s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        letter-spacing: 0.35em;
        font-weight: 800;
        text-indent: 0.35em;
        background: linear-gradient(180deg, #ffffff, #7d8cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(125, 140, 255, 0.35);
      }
      #boot p {
        font-size: 0.9rem;
        letter-spacing: 0.2em;
        opacity: 0.6;
        text-transform: uppercase;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(125, 140, 255, 0.25);
        border-top-color: #7d8cff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="boot">
      <h1>AFTERLIGHT</h1>
      <div class="spinner"></div>
      <p>Hold back the dark</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
