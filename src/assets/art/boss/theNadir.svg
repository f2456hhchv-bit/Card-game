<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- The Nadir — The Frozen Depth. An abyssal leviathan eye ringed with frozen
       tendrils, staring up from the deep. Original art. Design radius ~52. -->
  <defs>
    <radialGradient id="na-glow" cx="80" cy="80" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fd0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="na-body" cx="80" cy="80" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#274a86"/>
      <stop offset="0.6" stop-color="#152c54"/>
      <stop offset="1" stop-color="#08152c"/>
    </radialGradient>
    <radialGradient id="na-iris" cx="80" cy="80" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.45" stop-color="#3f9fe0"/>
      <stop offset="0.85" stop-color="#0e3a6e"/>
      <stop offset="1" stop-color="#04101f"/>
    </radialGradient>
    <filter id="na-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="na-shade" cx="80" cy="80" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <circle cx="80" cy="80" r="74" fill="url(#na-glow)"/>

  <!-- Frozen tendrils radiating outward (lashes), thick and tapering -->
  <g fill="#365f93" stroke="#16314f" stroke-width="1.2" filter="url(#na-soft)">
    <path d="M80 32 C74 14 86 6 84 22 C92 12 96 28 86 30 Z"/>
    <path d="M80 128 C86 146 74 154 76 138 C68 148 64 132 74 130 Z"/>
    <path d="M32 80 C14 74 6 86 22 84 C12 92 28 96 30 86 Z"/>
    <path d="M128 80 C146 74 154 86 138 84 C148 92 132 96 130 86 Z"/>
    <path d="M46 46 C34 30 22 36 36 42 C24 38 34 54 44 50 Z"/>
    <path d="M114 46 C126 30 138 36 124 42 C136 38 126 54 116 50 Z"/>
    <path d="M46 114 C34 130 22 124 36 118 C24 122 34 106 44 110 Z"/>
    <path d="M114 114 C126 130 138 124 124 118 C136 122 126 106 116 110 Z"/>
  </g>

  <!-- The abyssal eyeball -->
  <circle cx="80" cy="80" r="48" fill="url(#na-body)" stroke="#06101f" stroke-width="2"/>

  <!-- Iris + vertical leviathan pupil -->
  <circle cx="80" cy="80" r="26" fill="url(#na-iris)" stroke="#0e3a6e" stroke-width="1.5"/>
  <ellipse cx="80" cy="80" rx="7" ry="22" fill="#03101f"/>
  <ellipse cx="80" cy="80" rx="3" ry="14" fill="#7fd0ff" opacity="0.6"/>

  <!-- Painted volume: top-left specular, bottom form shadow, cold rim glint -->
  <ellipse cx="64" cy="60" rx="18" ry="11" fill="#bfe6ff" opacity="0.2" filter="url(#na-soft)"/>
  <circle cx="72" cy="70" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="80" cy="80" r="48" fill="url(#na-shade)"/>
  <path d="M80 32 A48 48 0 0 0 34 92" fill="none" stroke="#6fa8e0" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
</svg>
