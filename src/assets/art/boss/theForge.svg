<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- The Forge — Anvil of the Dark. A horned iron forge-golem: heavy brow, a
       snarling molten furnace-mouth, hammered plate. Original art. Radius ~52. -->
  <defs>
    <radialGradient id="fo-glow" cx="80" cy="92" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a18" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff4a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fo-iron" x1="40" y1="34" x2="118" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b6470"/>
      <stop offset="0.45" stop-color="#3c3743"/>
      <stop offset="1" stop-color="#15121b"/>
    </linearGradient>
    <linearGradient id="fo-horn" x1="30" y1="20" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b8390"/>
      <stop offset="1" stop-color="#2a2530"/>
    </linearGradient>
    <radialGradient id="fo-core" cx="80" cy="98" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d0"/>
      <stop offset="0.35" stop-color="#ffd23f"/>
      <stop offset="0.7" stop-color="#ff6a14"/>
      <stop offset="1" stop-color="#7a0c00"/>
    </radialGradient>
    <radialGradient id="fo-shade" cx="80" cy="80" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="fo-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <ellipse cx="80" cy="92" rx="74" ry="70" fill="url(#fo-glow)"/>

  <!-- Thick curved bull-horns -->
  <path d="M48 50 C30 40 20 24 26 18 C30 30 40 36 52 40 C54 28 44 18 38 14 C56 18 64 34 60 52 Z"
        fill="url(#fo-horn)" stroke="#0e0b12" stroke-width="1.6" filter="url(#fo-soft)"/>
  <path d="M112 50 C130 40 140 24 134 18 C130 30 120 36 108 40 C106 28 116 18 122 14 C104 18 96 34 100 52 Z"
        fill="url(#fo-horn)" stroke="#0e0b12" stroke-width="1.6" filter="url(#fo-soft)"/>

  <!-- Massive head/anvil mass -->
  <path d="M44 46 C44 38 60 34 80 34 C100 34 116 38 116 46
           L122 78 C124 92 118 104 110 116 L104 134 L56 134 L50 116
           C42 104 36 92 38 78 Z"
        fill="url(#fo-iron)" stroke="#0e0b12" stroke-width="2"/>

  <!-- Heavy brow ridge casting shadow over the eyes -->
  <path d="M46 58 L114 58 L108 70 C100 64 92 62 80 62 C68 62 60 64 52 70 Z"
        fill="#1c1822" stroke="#0e0b12" stroke-width="1.2"/>

  <!-- Angry forge eyes glowing under the brow -->
  <g filter="url(#fo-soft)">
    <path d="M56 72 L72 76 L70 82 L56 80 Z" fill="#ffd23f"/>
    <path d="M104 72 L88 76 L90 82 L104 80 Z" fill="#ffd23f"/>
  </g>
  <circle cx="64" cy="77" r="2.2" fill="#fff7d0"/>
  <circle cx="96" cy="77" r="2.2" fill="#fff7d0"/>

  <!-- Snarling molten furnace-mouth (the core) with iron fangs -->
  <path d="M58 92 C66 86 94 86 102 92 C98 116 84 124 80 124 C76 124 62 116 58 92 Z"
        fill="url(#fo-core)" stroke="#ffd23f" stroke-width="1"/>
  <g fill="#2a2530">
    <polygon points="64,92 70,100 60,98"/>
    <polygon points="78,92 84,102 72,100"/>
    <polygon points="92,92 96,98 86,100"/>
    <polygon points="70,118 76,110 80,118"/>
    <polygon points="90,116 84,110 80,118"/>
  </g>

  <!-- Hammered-plate seams + rivets -->
  <g stroke="#8b8390" stroke-width="1" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M50 50 L52 78 M110 50 L108 78 M58 132 L62 116 M102 132 L98 116"/>
  </g>
  <g fill="#9a93a3">
    <circle cx="48" cy="52" r="2"/><circle cx="112" cy="52" r="2"/>
    <circle cx="58" cy="130" r="2"/><circle cx="102" cy="130" r="2"/>
  </g>

  <!-- Top rim light + bottom form shadow for painted volume -->
  <path d="M52 40 C62 36 98 36 108 40" fill="none" stroke="#d7d0e0" stroke-width="2.4" opacity="0.45" stroke-linecap="round"/>
  <path d="M44 46 C44 38 60 34 80 34 C100 34 116 38 116 46 L122 78 C124 92 118 104 110 116 L104 134 L56 134 L50 116 C42 104 36 92 38 78 Z"
        fill="url(#fo-shade)"/>
</svg>
