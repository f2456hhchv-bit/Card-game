<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- The Pyre — Heart of Cinders. A cracked obsidian shell split open over a
       brilliant molten heart, flame-crowned. (Elemental core, not a face — the
       Forge is the face boss.) Original art. Design radius ~52. -->
  <defs>
    <radialGradient id="py-glow" cx="80" cy="84" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="py-core" cx="80" cy="86" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#fff0a0"/>
      <stop offset="0.62" stop-color="#ff8a1e"/>
      <stop offset="0.85" stop-color="#ff3a0a"/>
      <stop offset="1" stop-color="#9a0c00"/>
    </radialGradient>
    <linearGradient id="py-shell" x1="40" y1="38" x2="120" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43272f"/>
      <stop offset="0.55" stop-color="#1d1016"/>
      <stop offset="1" stop-color="#080306"/>
    </linearGradient>
    <linearGradient id="py-flame" x1="80" y1="8" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.5" stop-color="#ff9b1e"/>
      <stop offset="1" stop-color="#ff4d10"/>
    </linearGradient>
    <filter id="py-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <circle cx="80" cy="84" r="76" fill="url(#py-glow)"/>

  <!-- Flame crown licking up off the shell -->
  <g fill="url(#py-flame)" filter="url(#py-soft)">
    <path d="M80 10 C70 32 68 42 80 56 C92 42 90 32 80 10 Z"/>
    <path d="M50 26 C45 46 47 53 60 58 C66 46 62 35 50 26 Z"/>
    <path d="M110 26 C115 46 113 53 100 58 C94 46 98 35 110 26 Z"/>
    <path d="M32 56 C30 70 33 76 44 76 C46 66 42 60 32 56 Z"/>
    <path d="M128 56 C130 70 127 76 116 76 C114 66 118 60 128 56 Z"/>
  </g>

  <!-- Two obsidian shell halves, pulled apart over the heart -->
  <path d="M78 42 C44 46 30 70 34 100 C38 128 56 140 78 138 C66 116 62 96 66 76 C68 62 73 50 78 42 Z"
        fill="url(#py-shell)" stroke="#000" stroke-width="1.8"/>
  <path d="M82 42 C116 46 130 70 126 100 C122 128 104 140 82 138 C94 116 98 96 94 76 C92 62 87 50 82 42 Z"
        fill="url(#py-shell)" stroke="#000" stroke-width="1.8"/>
  <!-- Cool rim light on the shell edges -->
  <path d="M78 44 C50 50 36 72 39 100" fill="none" stroke="#6a4038" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- The molten heart blazing in the rift -->
  <path d="M80 56 C92 64 98 80 92 98 C88 112 80 124 80 124 C80 124 72 112 68 98 C62 80 68 64 80 56 Z"
        fill="url(#py-core)"/>
  <ellipse cx="80" cy="84" rx="9" ry="16" fill="#ffffff" opacity="0.85" filter="url(#py-soft)"/>

  <!-- Glowing lava veins crawling across the obsidian -->
  <g stroke="#ff6a1e" stroke-width="2.2" opacity="0.9" stroke-linecap="round" filter="url(#py-soft)">
    <path d="M50 70 L38 82 M48 104 L36 112 M110 70 L122 82 M112 104 L124 112 M54 124 L62 116 M106 124 L98 116"/>
  </g>
  <g fill="#ffb84a">
    <circle cx="44" cy="88" r="1.8"/><circle cx="116" cy="88" r="1.8"/>
    <circle cx="58" cy="60" r="1.6"/><circle cx="102" cy="60" r="1.6"/>
  </g>
</svg>
