<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- The Rime — Glacier Heart. A great frozen crystal heart radiating spikes of
       ice around a cold core. Original art. Design radius ~52. -->
  <defs>
    <radialGradient id="ri-glow" cx="80" cy="80" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fd6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fd6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ri-ice" x1="50" y1="36" x2="110" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0fbff"/>
      <stop offset="0.45" stop-color="#a8e8ff"/>
      <stop offset="1" stop-color="#2f7fc0"/>
    </linearGradient>
    <linearGradient id="ri-spike" x1="40" y1="40" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#2a6fae"/>
    </linearGradient>
    <radialGradient id="ri-core" cx="80" cy="82" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#1572b8"/>
    </radialGradient>
    <filter id="ri-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <circle cx="80" cy="80" r="74" fill="url(#ri-glow)"/>

  <!-- Radiating ice spikes (8-point frozen star, behind the heart) -->
  <g fill="url(#ri-spike)" stroke="#1d6fae" stroke-width="1" filter="url(#ri-soft)">
    <polygon points="80,8 88,52 72,52"/>
    <polygon points="80,152 88,108 72,108"/>
    <polygon points="8,80 52,72 52,88"/>
    <polygon points="152,80 108,72 108,88"/>
    <polygon points="30,30 64,56 56,64"/>
    <polygon points="130,30 96,56 104,64"/>
    <polygon points="30,130 64,104 56,96"/>
    <polygon points="130,130 96,104 104,96"/>
  </g>

  <!-- Crystal heart (faceted diamond body) -->
  <polygon points="80,34 110,66 80,126 50,66" fill="url(#ri-ice)" stroke="#1d6fae" stroke-width="2"/>
  <!-- Facets -->
  <polygon points="80,34 92,66 80,98 68,66" fill="#ffffff" opacity="0.45"/>
  <polygon points="50,66 68,66 80,126" fill="#bfeaff" opacity="0.35"/>
  <polygon points="110,66 92,66 80,126" fill="#5fb0e6" opacity="0.3"/>

  <!-- Cold core -->
  <circle cx="80" cy="74" r="13" fill="url(#ri-core)"/>
  <circle cx="80" cy="72" r="5" fill="#ffffff" filter="url(#ri-soft)"/>
</svg>
