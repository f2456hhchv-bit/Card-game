<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- AFTERLIGHT — Guardian starship. Original art (hand-authored vector,
       painterly shading). Nose points up (-Y); the renderer rotates to facing. -->
  <defs>
    <linearGradient id="hull" x1="60" y1="20" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="0.32" stop-color="#bcd6f5"/>
      <stop offset="0.62" stop-color="#6f8fd6"/>
      <stop offset="1" stop-color="#3a4f99"/>
    </linearGradient>
    <linearGradient id="hullShade" x1="40" y1="30" x2="78" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1733" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wing" x1="20" y1="55" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fb8ec"/>
      <stop offset="0.55" stop-color="#5d76c4"/>
      <stop offset="1" stop-color="#2c3c7d"/>
    </linearGradient>
    <radialGradient id="canopy" cx="60" cy="46" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.4" stop-color="#5fd0ff"/>
      <stop offset="0.85" stop-color="#1f6fd0"/>
      <stop offset="1" stop-color="#0b3a7a"/>
    </radialGradient>
    <radialGradient id="engine" cx="60" cy="100" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.4" stop-color="#54b0ff"/>
      <stop offset="1" stop-color="#54b0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Engine exhaust bloom behind the tail -->
  <ellipse cx="60" cy="103" rx="15" ry="20" fill="url(#engine)" filter="url(#glow)"/>

  <!-- Bold swept wings (left, then mirrored right), drawn behind the fuselage -->
  <g filter="url(#soft)">
    <path d="M55 52 L14 84 L26 95 L55 78 Z" fill="url(#wing)" stroke="#22305e" stroke-width="1"/>
    <path d="M65 52 L106 84 L94 95 L65 78 Z" fill="url(#wing)" stroke="#22305e" stroke-width="1"/>
  </g>
  <!-- Wing leading-edge rim light -->
  <path d="M55 52 L16 83 L22 86 L55 60 Z" fill="#dbe8ff" opacity="0.55"/>
  <path d="M65 52 L104 83 L98 86 L65 60 Z" fill="#8aa2dc" opacity="0.5"/>
  <!-- Wingtip running lights -->
  <circle cx="19" cy="86" r="2.4" fill="#7fe0ff"/>
  <circle cx="101" cy="86" r="2.4" fill="#ff7f9a"/>

  <!-- Fuselage: a sleek dart from nose (top) to tail (bottom) -->
  <path d="M60 18
           C66 30 71 44 71 60
           C71 76 68 88 60 98
           C52 88 49 76 49 60
           C49 44 54 30 60 18 Z"
        fill="url(#hull)" stroke="#22305e" stroke-width="1.4"/>
  <!-- Painterly light/shadow overlay on the hull -->
  <path d="M60 18
           C66 30 71 44 71 60
           C71 76 68 88 60 98
           C52 88 49 76 49 60
           C49 44 54 30 60 18 Z"
        fill="url(#hullShade)"/>
  <!-- Hull centre ridge highlight -->
  <path d="M60 22 L60 94" stroke="#ffffff" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
  <!-- Rim light along the left edge -->
  <path d="M60 20 C54 31 50 45 50 60 C50 74 53 86 59 96"
        fill="none" stroke="#eaf4ff" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>

  <!-- Cockpit canopy -->
  <ellipse cx="60" cy="47" rx="8.5" ry="12" fill="url(#canopy)" stroke="#0b2f63" stroke-width="1"/>
  <ellipse cx="57" cy="43" rx="2.6" ry="4.4" fill="#ffffff" opacity="0.8"/>

  <!-- Nose tip glint -->
  <path d="M60 18 C62 22 63 26 62.5 30 L57.5 30 C57 26 58 22 60 18 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Twin engine nozzles -->
  <rect x="52" y="92" width="6" height="9" rx="3" fill="#2a3358"/>
  <rect x="62" y="92" width="6" height="9" rx="3" fill="#2a3358"/>
  <circle cx="55" cy="100" r="3.1" fill="#bfe6ff" filter="url(#soft)"/>
  <circle cx="65" cy="100" r="3.1" fill="#bfe6ff" filter="url(#soft)"/>
</svg>
