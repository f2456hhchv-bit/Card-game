<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Wisp — an ethereal will-o'-the-wisp that circles. A teal flame-spirit with
       trailing tongues and a bright core. Original art. Design radius ~30. -->
  <defs>
    <radialGradient id="wi-body" cx="60" cy="66" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset="0.35" stop-color="#7df0d8"/>
      <stop offset="0.75" stop-color="#22b89a"/>
      <stop offset="1" stop-color="#0e6e5e"/>
    </radialGradient>
    <radialGradient id="wi-glow" cx="60" cy="60" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fe0c0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fe0c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="wi-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <circle cx="60" cy="60" r="44" fill="url(#wi-glow)"/>

  <!-- Flame-spirit body rising into three tongues -->
  <path d="M60 22
           C50 38 46 46 50 58
           C42 54 40 66 48 72
           C44 82 50 96 60 100
           C70 96 76 82 72 72
           C80 66 78 54 70 58
           C74 46 70 38 60 22 Z"
        fill="url(#wi-body)" stroke="#0c5448" stroke-width="1.4" filter="url(#wi-soft)"/>
  <!-- Bright core -->
  <ellipse cx="60" cy="68" rx="11" ry="15" fill="#eafffb" opacity="0.85" filter="url(#wi-soft)"/>

  <!-- Faint watching eyes -->
  <circle cx="54" cy="64" r="3" fill="#0c5448"/>
  <circle cx="66" cy="64" r="3" fill="#0c5448"/>
  <circle cx="54.5" cy="62.5" r="1" fill="#eafffb"/>
  <circle cx="66.5" cy="62.5" r="1" fill="#eafffb"/>

  <!-- Trailing wisps -->
  <circle cx="40" cy="40" r="2.4" fill="#7df0d8" opacity="0.8" filter="url(#wi-soft)"/>
  <circle cx="82" cy="44" r="2" fill="#7df0d8" opacity="0.7" filter="url(#wi-soft)"/>
  <circle cx="60" cy="104" r="2.2" fill="#7df0d8" opacity="0.7" filter="url(#wi-soft)"/>
</svg>
