<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Lunger — a crouched predator that pounces. Fanged maw forward, swept
       haunches. Faces up (-Y); renderer aims it at the Warden. Original art. R~30. -->
  <defs>
    <linearGradient id="lu-body" x1="60" y1="22" x2="60" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7ab0"/>
      <stop offset="0.5" stop-color="#c33a78"/>
      <stop offset="1" stop-color="#5e1640"/>
    </linearGradient>
    <linearGradient id="lu-leg" x1="30" y1="60" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8456f"/>
      <stop offset="1" stop-color="#3e0f2a"/>
    </linearGradient>
    <radialGradient id="lu-glow" cx="60" cy="58" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4f94" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4f94" stop-opacity="0"/>
    </radialGradient>
    <filter id="lu-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>

  <circle cx="60" cy="60" r="42" fill="url(#lu-glow)"/>

  <!-- Swept-back haunches -->
  <path d="M52 56 L24 92 L42 90 L54 72 Z" fill="url(#lu-leg)" stroke="#2c0a1e" stroke-width="1.3" filter="url(#lu-soft)"/>
  <path d="M68 56 L96 92 L78 90 L66 72 Z" fill="url(#lu-leg)" stroke="#2c0a1e" stroke-width="1.3" filter="url(#lu-soft)"/>

  <!-- Lean lunging body (head forward = up) -->
  <path d="M60 22 C72 30 76 46 72 64 C70 80 66 92 60 98 C54 92 50 80 48 64 C44 46 48 30 60 22 Z"
        fill="url(#lu-body)" stroke="#33091f" stroke-width="1.6"/>
  <!-- Back ridge highlight -->
  <path d="M60 28 L60 90" stroke="#ffc2dd" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>

  <!-- Fanged maw at the front -->
  <path d="M50 30 C54 24 66 24 70 30 C66 38 54 38 50 30 Z" fill="#2a0716"/>
  <polygon points="53,30 56,37 50,34" fill="#ffe0ec"/>
  <polygon points="67,30 64,37 70,34" fill="#ffe0ec"/>
  <polygon points="60,32 62,40 58,40" fill="#ffe0ec"/>

  <!-- Predator eyes -->
  <circle cx="53" cy="46" r="3.4" fill="#fff0a0"/>
  <circle cx="67" cy="46" r="3.4" fill="#fff0a0"/>
  <circle cx="53" cy="46" r="1.4" fill="#5e1640"/>
  <circle cx="67" cy="46" r="1.4" fill="#5e1640"/>
</svg>
