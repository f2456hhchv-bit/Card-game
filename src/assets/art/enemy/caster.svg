<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Caster — a small hooded hex-caster that keeps its distance and channels a
       glowing orb. Original art. Design radius ~30. -->
  <defs>
    <linearGradient id="ca-robe" x1="60" y1="32" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c14fb0"/>
      <stop offset="0.5" stop-color="#7d2a8e"/>
      <stop offset="1" stop-color="#3a1248"/>
    </linearGradient>
    <radialGradient id="ca-orb" cx="60" cy="40" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ff9bff"/>
      <stop offset="0.85" stop-color="#c23ad0"/>
      <stop offset="1" stop-color="#7d1a8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ca-glow" cx="60" cy="64" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e04fd0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e04fd0" stop-opacity="0"/>
    </radialGradient>
    <filter id="ca-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <circle cx="60" cy="64" r="42" fill="url(#ca-glow)"/>

  <!-- Robed body with flared, pointed hem -->
  <path d="M60 40 C44 40 38 54 40 70 C42 84 40 92 36 100 L52 94 L60 100 L68 94 L84 100 C80 92 78 84 80 70 C82 54 76 40 60 40 Z"
        fill="url(#ca-robe)" stroke="#250c30" stroke-width="1.6"/>

  <!-- Pointed hood -->
  <path d="M60 34 C48 36 44 50 48 62 C52 70 60 70 60 70 C60 70 68 70 72 62 C76 50 72 36 60 34 Z"
        fill="#3a1248" stroke="#1c0726" stroke-width="1.4"/>
  <!-- Hood opening shadow + glowing eyes -->
  <path d="M60 44 C52 45 49 54 52 62 C55 67 60 68 60 68 C60 68 65 67 68 62 C71 54 68 45 60 44 Z" fill="#120420"/>
  <circle cx="55" cy="56" r="2.6" fill="#ff9bff" filter="url(#ca-soft)"/>
  <circle cx="65" cy="56" r="2.6" fill="#ff9bff" filter="url(#ca-soft)"/>

  <!-- Channelled hex orb floating before it -->
  <circle cx="60" cy="40" r="12" fill="url(#ca-orb)"/>
  <circle cx="60" cy="40" r="4.5" fill="#ffffff" filter="url(#ca-soft)"/>
  <!-- Rim light on the robe -->
  <path d="M60 41 C46 42 40 55 42 70" fill="none" stroke="#e88fd8" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
</svg>
