<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Mote — a tiny, fast darting light-sprite. Frail core with little fins and a
       faint comet veil. Original art. Design radius ~30. -->
  <defs>
    <radialGradient id="mo-core" cx="60" cy="58" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#bfeaff"/>
      <stop offset="0.8" stop-color="#3f9fe0"/>
      <stop offset="1" stop-color="#1560a0"/>
    </radialGradient>
    <radialGradient id="mo-glow" cx="60" cy="58" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fc8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5fc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mo-fin" x1="40" y1="50" x2="60" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#2f7fc0"/>
    </linearGradient>
    <filter id="mo-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <circle cx="60" cy="58" r="40" fill="url(#mo-glow)"/>

  <!-- Little swept fins -->
  <path d="M58 50 L34 70 L46 72 L58 62 Z" fill="url(#mo-fin)" opacity="0.9" filter="url(#mo-soft)"/>
  <path d="M62 50 L86 70 L74 72 L62 62 Z" fill="url(#mo-fin)" opacity="0.9" filter="url(#mo-soft)"/>

  <!-- Bright body core -->
  <circle cx="60" cy="58" r="17" fill="url(#mo-core)" stroke="#15538a" stroke-width="1.2"/>
  <!-- Two tiny eyes -->
  <circle cx="55" cy="56" r="2.3" fill="#0a2a44"/>
  <circle cx="65" cy="56" r="2.3" fill="#0a2a44"/>
  <!-- Hot inner glint -->
  <circle cx="60" cy="56" r="6" fill="#ffffff" opacity="0.8" filter="url(#mo-soft)"/>
  <!-- Trailing spark -->
  <circle cx="60" cy="86" r="3" fill="#bfeaff" filter="url(#mo-soft)"/>
  <circle cx="60" cy="96" r="1.6" fill="#bfeaff" opacity="0.7" filter="url(#mo-soft)"/>
</svg>
