<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Shard — Hollow Deep fast fodder. A darting cluster of living ice. Original art. -->
  <defs>
    <linearGradient id="sh-ice" x1="44" y1="24" x2="74" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecfbff"/>
      <stop offset="0.45" stop-color="#9fe6ff"/>
      <stop offset="1" stop-color="#2f8fd6"/>
    </linearGradient>
    <linearGradient id="sh-ice2" x1="30" y1="40" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bff0ff"/>
      <stop offset="1" stop-color="#1f6fb8"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="60" cy="60" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fd6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fd6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="42" fill="url(#sh-glow)"/>

  <!-- Side crystals (behind) -->
  <polygon points="36,52 50,40 56,64 44,84" fill="url(#sh-ice2)" stroke="#155a96" stroke-width="1.1"/>
  <polygon points="84,52 70,40 64,64 76,84" fill="url(#sh-ice2)" stroke="#155a96" stroke-width="1.1"/>

  <!-- Main spire (front) -->
  <polygon points="60,20 73,58 60,100 47,58" fill="url(#sh-ice)" stroke="#1d6fae" stroke-width="1.4"/>
  <!-- Facet highlights -->
  <polygon points="60,20 66,58 60,86 56,58" fill="#ffffff" opacity="0.55"/>
  <polygon points="50,44 56,60 50,76 46,60" fill="#dff6ff" opacity="0.4"/>

  <!-- Cold inner glints -->
  <circle cx="60" cy="56" r="3.4" fill="#eafcff"/>
  <circle cx="44" cy="60" r="2" fill="#eafcff" opacity="0.85"/>
  <circle cx="76" cy="60" r="2" fill="#eafcff" opacity="0.85"/>
</svg>
