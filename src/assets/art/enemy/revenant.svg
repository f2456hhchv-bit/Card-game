<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Revenant — Ember Wastes ranged caster. A hooded ember-wraith. Original art. -->
  <defs>
    <linearGradient id="rv-cowl" x1="60" y1="20" x2="60" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a1430"/>
      <stop offset="0.5" stop-color="#4a0d22"/>
      <stop offset="1" stop-color="#23030f"/>
    </linearGradient>
    <linearGradient id="rv-edge" x1="30" y1="30" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c23a55" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c23a55" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rv-eye" cx="0" cy="0" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe6a0"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ragged spectral robe + tattered hem -->
  <path d="M60 20
           C40 22 30 40 31 60
           C32 78 40 92 38 104
           L48 96 L52 106 L60 98 L68 106 L72 96 L82 104
           C80 92 88 78 89 60
           C90 40 80 22 60 20 Z"
        fill="url(#rv-cowl)" stroke="#13020a" stroke-width="1.4"/>
  <!-- Cool rim light on the robe edge -->
  <path d="M60 20 C42 22 33 39 34 60 C35 76 41 88 40 100"
        fill="none" stroke="url(#rv-edge)" stroke-width="3" stroke-linecap="round"/>

  <!-- The dark hood cavity -->
  <path d="M60 30 C47 31 41 44 43 58 C45 70 53 76 60 76 C67 76 75 70 77 58 C79 44 73 31 60 30 Z"
        fill="#0c0207"/>

  <!-- Two burning eyes -->
  <circle cx="52" cy="55" r="6" fill="url(#rv-eye)"/>
  <circle cx="68" cy="55" r="6" fill="url(#rv-eye)"/>
  <circle cx="52" cy="55" r="2.4" fill="#fff2c2"/>
  <circle cx="68" cy="55" r="2.4" fill="#fff2c2"/>

  <!-- Floating ember motes around the wraith -->
  <circle cx="30" cy="46" r="2.2" fill="#ff8a2a" opacity="0.9"/>
  <circle cx="92" cy="52" r="1.8" fill="#ffb347" opacity="0.85"/>
  <circle cx="86" cy="34" r="1.5" fill="#ff8a2a" opacity="0.8"/>
</svg>
