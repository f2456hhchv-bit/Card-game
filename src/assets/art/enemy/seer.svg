<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Seer — a hovering arcane rune-sentinel of the Fade. An eye-sigil set in a
       dark hex plate, watching. Original art. Design radius ~30. -->
  <defs>
    <linearGradient id="se-plate" x1="40" y1="34" x2="80" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a3a6e"/>
      <stop offset="0.55" stop-color="#2a2046"/>
      <stop offset="1" stop-color="#120c22"/>
    </linearGradient>
    <radialGradient id="se-eye" cx="60" cy="60" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0e0ff"/>
      <stop offset="0.45" stop-color="#b984ff"/>
      <stop offset="0.85" stop-color="#7a2ce0"/>
      <stop offset="1" stop-color="#3a128a"/>
    </radialGradient>
    <radialGradient id="se-glow" cx="60" cy="60" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b4cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9b4cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="se-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <circle cx="60" cy="60" r="44" fill="url(#se-glow)"/>

  <!-- Hex rune plate -->
  <polygon points="60,26 90,43 90,77 60,94 30,77 30,43"
           fill="url(#se-plate)" stroke="#0f0a1e" stroke-width="2"/>
  <!-- Bevel highlight -->
  <polygon points="60,26 90,43 60,38 30,43" fill="#6a559a" opacity="0.4"/>
  <!-- Etched rune lines -->
  <g stroke="#9b6cff" stroke-width="1.2" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M38 48 L48 54 M82 48 L72 54 M38 72 L48 66 M82 72 L72 66"/>
  </g>

  <!-- The watching eye-slit -->
  <ellipse cx="60" cy="60" rx="11" ry="17" fill="url(#se-eye)" stroke="#2a0f5a" stroke-width="1.2"/>
  <ellipse cx="60" cy="60" rx="3.4" ry="12" fill="#1a0540"/>
  <ellipse cx="60" cy="60" rx="1.5" ry="8" fill="#d9b6ff" opacity="0.7"/>
  <circle cx="56" cy="52" r="2.2" fill="#ffffff" opacity="0.8"/>

  <!-- Orbiting sub-runes -->
  <circle cx="60" cy="20" r="2.6" fill="#b984ff" filter="url(#se-soft)"/>
  <circle cx="96" cy="60" r="2.2" fill="#b984ff" filter="url(#se-soft)"/>
  <circle cx="24" cy="60" r="2.2" fill="#b984ff" filter="url(#se-soft)"/>
</svg>
