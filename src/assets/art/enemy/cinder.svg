<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Cinder — Ember Wastes fodder. A vicious little living flame. Original art. -->
  <defs>
    <radialGradient id="ci-body" cx="60" cy="70" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.35" stop-color="#ffd23f"/>
      <stop offset="0.7" stop-color="#ff7314"/>
      <stop offset="1" stop-color="#c01806"/>
    </radialGradient>
    <radialGradient id="ci-glow" cx="60" cy="64" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a1e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a1e" stop-opacity="0"/>
    </radialGradient>
    <filter id="ci-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <!-- Heat haze -->
  <circle cx="60" cy="64" r="44" fill="url(#ci-glow)"/>

  <!-- Flame body: a teardrop rising into three jagged tongues -->
  <path d="M60 22
           C50 36 44 44 44 58
           C36 50 34 62 40 72
           C34 80 40 96 60 100
           C80 96 86 80 80 72
           C86 62 84 50 76 58
           C76 44 70 36 60 22 Z"
        fill="url(#ci-body)" stroke="#7c1100" stroke-width="1.4" filter="url(#ci-soft)"/>
  <!-- Inner core highlight -->
  <path d="M60 40 C54 50 52 60 56 74 C60 82 64 78 64 70 C66 58 64 48 60 40 Z"
        fill="#fff6cf" opacity="0.8"/>

  <!-- Angry eyes -->
  <ellipse cx="52" cy="66" rx="4.6" ry="6" fill="#2a0a00"/>
  <ellipse cx="68" cy="66" rx="4.6" ry="6" fill="#2a0a00"/>
  <circle cx="52.6" cy="64" r="1.6" fill="#ffd23f"/>
  <circle cx="68.6" cy="64" r="1.6" fill="#ffd23f"/>
  <!-- Furrowed brow -->
  <path d="M46 58 L57 62" stroke="#7c1100" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M74 58 L63 62" stroke="#7c1100" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Sparks -->
  <circle cx="42" cy="30" r="2" fill="#ffd23f" opacity="0.9"/>
  <circle cx="80" cy="34" r="1.6" fill="#ff9b3f" opacity="0.85"/>
</svg>
